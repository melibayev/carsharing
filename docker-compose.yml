services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CarSharing}
      POSTGRES_USER: ${POSTGRES_USER:-CarSharing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-CarSharing} -d ${POSTGRES_DB:-CarSharing}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend/CarSharing.Api
      dockerfile: Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-CarSharing};Username=${POSTGRES_USER:-CarSharing};Password=${POSTGRES_PASSWORD:-change_me}"
      ConnectionStrings__Redis: "redis:6379"
      JWT__Secret: ${JWT_SECRET:-replace-with-32-character-or-longer-secret}
      JWT__Issuer: ${JWT_ISSUER:-CarSharing}
      JWT__Audience: ${JWT_AUDIENCE:-CarSharing-web}
      JWT__AccessMinutes: ${JWT_ACCESS_MINUTES:-15}
      JWT__RefreshDays: ${JWT_REFRESH_DAYS:-14}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Smtp__Host: ${SMTP_HOST:-smtp-relay.brevo.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      App__RunMigrationsOnStartup: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      App__SeedOnStartup: ${SEED_ON_STARTUP:-true}
      App__AutoApproveCarsInDev: ${AUTO_APPROVE_CARS_IN_DEV:-true}
      App__CorsOrigins: ${CORS_ORIGINS:-http://localhost:3000}
      Twilio__Enabled: ${TWILIO_ENABLED:-false}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__FromPhone: ${TWILIO_FROM_PHONE:-}
      Sms__DevLogPath: /app/dev-sms.log
    volumes:
      - uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
